<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Кодировка нужна для текста на русском и украинском. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель | CUECRAFT</title>
    <base href="<!-- BASE_PATH -->">
    <link rel="stylesheet" href="static/css/admin-login.css">
</head>
<body>
    <main class="login-card">
        <a class="logo" href="./">CUE<span>CRAFT</span></a>
        <p class="eyebrow">АДМИН-ПАНЕЛЬ</p>
        <h1>Вход</h1>
        <p class="intro">Введи пароль, чтобы посмотреть заявки клиентов.</p>

        <!-- При отправке формы JavaScript проверит пароль через PHP. -->
        <form id="login-form">
            <label for="admin-password">Пароль</label>
            <input id="admin-password" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
            <p class="form-status" id="login-status" aria-live="polite"></p>
            <button type="submit">Войти</button>
        </form>

        <a class="back-link" href="./">← Вернуться к сайту</a>
    </main>

    <script src="static/js/admin-login.js"></script>
</body>
</html>
